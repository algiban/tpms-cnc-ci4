; /etc/php/8.3/fpm/pool.d/tpms.conf
; Starting point for a combined 4 vCPU / 8 GB application+database server.
; Measure real worker RSS before increasing pm.max_children.

[tpms]
user = www-data
group = www-data

listen = /run/php/php8.3-fpm-tpms.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 24
pm.start_servers = 8
pm.min_spare_servers = 6
pm.max_spare_servers = 12
pm.max_requests = 1000

; Helps identify workers stuck on unexpected slow requests.
request_slowlog_timeout = 5s
slowlog = /var/log/php8.3-fpm-tpms-slow.log
request_terminate_timeout = 90s

; Local-only FPM status/ping endpoints are exposed by nginx.
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong

catch_workers_output = yes
clear_env = yes

php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 90
php_admin_value[max_input_time] = 60
php_admin_value[post_max_size] = 32M
php_admin_value[upload_max_filesize] = 32M
php_admin_value[log_errors] = On
php_admin_value[display_errors] = Off
