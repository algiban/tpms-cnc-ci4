# /etc/nginx/sites-available/tpms
# Baseline for one TPMS CI4 node (100-200 devices).
# Adjust server_name, root and PHP socket to match your server.

server {
    listen 80;
    listen [::]:80;
    server_name tpms.example.local;

    root /var/www/tpms/current/public;
    index index.php;

    charset utf-8;
    client_max_body_size 32m;
    keepalive_timeout 15s;
    client_body_timeout 30s;
    send_timeout 60s;

    # Normal browser/admin access log.
    access_log /var/log/nginx/tpms.access.log;
    error_log  /var/log/nginx/tpms.error.log warn;

    # High-frequency polling endpoints intentionally skip access logs.
    # At 100 devices x 1 request/s, logging every poll can create millions
    # of lines/day while adding disk IO with little operational value.
    location = /api/tpms/production/state {
        access_log off;
        try_files $uri /index.php$is_args$args;
    }

    location = /api/tpms/heartbeat {
        access_log off;
        try_files $uri /index.php$is_args$args;
    }

    location = /api/monitoring {
        access_log off;
        try_files $uri /index.php$is_args$args;
    }

    location = /health/live {
        access_log off;
        try_files $uri /index.php$is_args$args;
    }

    location = /health/ready {
        access_log off;
        try_files $uri /index.php$is_args$args;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Only the public front controller may execute PHP.
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/php8.3-fpm-tpms.sock;
        fastcgi_keep_conn on;
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout 90s;
        fastcgi_read_timeout 90s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 32k;
    }

    # PHP-FPM diagnostics: local machine only.
    location = /fpm-status {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME /fpm-status;
        fastcgi_pass unix:/run/php/php8.3-fpm-tpms.sock;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        access_log off;
    }

    location = /fpm-ping {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME /fpm-ping;
        fastcgi_pass unix:/run/php/php8.3-fpm-tpms.sock;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        access_log off;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
        access_log off;
    }

    # public/ should be the document root, but keep an extra deny rule.
    location ~ /\. {
        deny all;
    }
}
