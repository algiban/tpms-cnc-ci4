; /etc/php/8.3/fpm/conf.d/99-tpms.ini
; Production PHP baseline for TPMS.

expose_php = Off
memory_limit = 256M
max_execution_time = 90
max_input_time = 60
post_max_size = 32M
upload_max_filesize = 32M

; Avoid repeated filesystem stat/compile work on every request.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; OPcache: deploys should restart/reload PHP-FPM after code changes.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.jit = 0

; APCu is optional but recommended for one-node monitoring cache.
apc.enabled = 1
apc.enable_cli = 0
apc.shm_size = 64M
apc.ttl = 120
apc.gc_ttl = 600
